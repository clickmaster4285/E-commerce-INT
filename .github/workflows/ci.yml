name: CI

on:
  pull_request:
  push:
    branches: [main, optimizing_v1]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Config sirf env se aata hai (koi default nahi) — example file se dev values
      - name: Create .env from example
        run: cp .env.example .env
      # Tests MongoMemoryReplSet use karte hain (mongod binary download hota hai) — cache karo
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm test
        env:
          NODE_ENV: test
          LOG_LEVEL: silent

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # NOTE: lint baseline abhi dirty hai (~115 errors / 50 warnings, Nov 2026) — isliye
      # continue-on-error: true. Baseline saaf hone par ise false kar do.
      - run: npm run lint
        continue-on-error: true
