<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <title>{{STORE_NAME}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f4f5;padding:28px 12px;font-family:Inter,Segoe UI,Arial,sans-serif;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e5e7eb;">
          <tr>
            <td style="background:#0f172a;padding:22px 30px;">
              <p style="margin:0;color:#ffffff;font-size:17px;font-weight:700;letter-spacing:.02em;">{{STORE_NAME}}</p>
              <p style="margin:2px 0 0;color:#a5b4fc;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;">Seller Program</p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 30px;">
              {{CONTENT}}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 30px;background:#fafafa;border-top:1px solid #f0f0f0;">
              <p style="margin:0;color:#a3a3a3;font-size:11.5px;line-height:1.6;">
                © {{YEAR}} {{STORE_NAME}}. All rights reserved.<br />
                Questions? <a href="mailto:{{SUPPORT_EMAIL}}" style="color:#4f46e5;text-decoration:none;">{{SUPPORT_EMAIL}}</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
