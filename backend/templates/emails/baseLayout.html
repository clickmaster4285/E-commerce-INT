<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="x-ua-compatible" content="ie=edge" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="color-scheme" content="light" />
  <meta name="supported-color-schemes" content="light" />
  <title>{{PLATFORM}}</title>
  <style>
    @media only screen and (max-width: 620px) {
      .container { width: 100% !important; }
      .px { padding-left: 22px !important; padding-right: 22px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;-webkit-text-size-adjust:100%;">
  <!-- Inbox preview text (hidden) -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;mso-hide:all;font-size:1px;line-height:1px;color:#f4f5f7;">{{PREHEADER}}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f5f7;">
    <tr>
      <td align="center" style="padding:32px 12px;">
        <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;">

          <!-- Brand -->
          <tr>
            <td style="padding:0 4px 18px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
                <td width="36" height="36" align="center" valign="middle" bgcolor="{{ORANGE}}" style="width:36px;height:36px;border-radius:9px;background:{{ORANGE}};color:#ffffff;font-family:{{FONT}};font-size:17px;font-weight:800;line-height:36px;">{{PLATFORM_INITIAL}}</td>
                <td style="padding-left:10px;font-family:{{FONT}};font-size:17px;font-weight:700;color:{{NAVY}};">{{PLATFORM}}</td>
              </tr></table>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background:#ffffff;border:1px solid {{BORDER}};border-radius:16px;overflow:hidden;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td height="4" style="height:4px;line-height:4px;font-size:0;background:{{ORANGE}};border-radius:16px 16px 0 0;">&nbsp;</td></tr>
                <tr>
                  <td class="px" style="padding:34px 40px 18px;">
                    {{CONTENT}}
                  </td>
                </tr>
                <tr>
                  <td class="px" style="padding:18px 40px 26px;border-top:1px solid {{BORDER}};font-family:{{FONT}};font-size:13px;line-height:1.6;color:{{MUTED}};">
                    Need help? Reply to this email or contact
                    <a href="mailto:{{SUPPORT_EMAIL}}" style="color:{{NAVY}};font-weight:600;text-decoration:none;">{{SUPPORT_EMAIL}}</a>.
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:22px 24px 0;font-family:{{FONT}};font-size:12px;line-height:1.6;color:#94a3b8;">
              {{FOOTER_NOTE}}<br />
              &copy; {{YEAR}} {{PLATFORM}}. All rights reserved.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
